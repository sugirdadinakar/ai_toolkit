<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[Prototype Name]</title>
  <!-- Zero-build: Tailwind via CDN. No npm, no bundler. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Design tokens: see DesignSystem.html for the full system. -->
  <style>
    :root {
      --brand-600: #2563eb;
      --brand-700: #1d4ed8;
      --ink-900: #111827;
      --ink-600: #4b5563;
      --line: #e5e7eb;
    }
    /* Visible focus ring for every interactive element */
    .focus-ring:focus-visible {
      outline: 2px solid var(--brand-600);
      outline-offset: 2px;
      border-radius: 6px;
    }
  </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 antialiased">
  <!-- Accessibility: skip link -->
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:rounded focus:bg-white focus:px-3 focus:py-2 focus:shadow focus-ring">Skip to content</a>

  <!-- ===================== HEADER / NAV ===================== -->
  <header class="border-b border-gray-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-3">
      <div class="flex items-center gap-2">
        <div class="h-7 w-7 rounded-lg" style="background: var(--brand-600)"></div>
        <span class="text-sm font-semibold">[Product]</span>
      </div>
      <nav aria-label="Primary" class="flex items-center gap-1">
        <button class="focus-ring rounded-md px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-100">Nav item</button>
        <button class="focus-ring rounded-md bg-blue-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-blue-700">Primary action</button>
      </nav>
    </div>
  </header>

  <!-- ===================== MAIN ===================== -->
  <main id="main" class="mx-auto max-w-6xl px-6 py-8">
    <h1 class="text-2xl font-semibold tracking-tight">[Screen title]</h1>
    <p class="mt-1 text-sm text-gray-600">[One-line description of this screen's purpose.]</p>

    <!-- Replace the section below with your constraint-specific layout -->
    <section class="mt-6 rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
      <p class="text-sm text-gray-600">Build your prototype here. Follow your assigned structural constraint strictly.</p>
    </section>
  </main>

  <!-- ===================== INTERACTIONS ===================== -->
  <!-- All JavaScript in a SINGLE script block at the end of body. Vanilla JS only. -->
  <script>
    (function () {
      "use strict";
      // Example: event delegation for interactive elements
      document.addEventListener("click", function (e) {
        const trigger = e.target.closest("[data-action]");
        if (!trigger) return;
        const action = trigger.getAttribute("data-action");
        // handle actions here
      });

      // Example: close modals/overlays on Escape
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          document.querySelectorAll("[data-overlay].open").forEach(function (el) {
            el.classList.remove("open");
          });
        }
      });
    })();
  </script>
</body>
</html>
